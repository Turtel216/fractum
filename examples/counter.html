<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fractum Counter — Runtime Demo</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f0f1a;
      color: #e0e0e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-container {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow:
        0 25px 50px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.03);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: #a0a0c0;
      margin-bottom: 32px;
      text-transform: uppercase;
    }

    .counter-display {
      margin-bottom: 36px;
    }

    .count {
      font-size: 5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
      display: inline-block;
      transition: transform 0.15s ease;
    }

    .button-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-minus {
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      color: white;
    }
    .btn-minus:hover {
      box-shadow: 0 6px 20px rgba(238, 90, 36, 0.4);
      transform: translateY(-2px);
    }

    .btn-reset {
      background: rgba(255, 255, 255, 0.08);
      color: #a0a0c0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-reset:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #e0e0e8;
      transform: translateY(-2px);
    }

    .btn-plus {
      background: linear-gradient(135deg, #48c6ef, #6f86d6);
      color: white;
    }
    .btn-plus:hover {
      box-shadow: 0 6px 20px rgba(111, 134, 214, 0.4);
      transform: translateY(-2px);
    }

    .delay-section {
      margin-bottom: 28px;
    }

    .btn-delay {
      background: linear-gradient(135deg, #a18cd1, #fbc2eb);
      color: #1a1a2e;
      width: 100%;
    }
    .btn-delay:hover {
      box-shadow: 0 6px 20px rgba(161, 140, 209, 0.4);
      transform: translateY(-2px);
    }

    .label-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .label-section label {
      font-size: 0.9rem;
      color: #a0a0c0;
      white-space: nowrap;
    }

    .label-section input {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      color: #e0e0e8;
      outline: none;
      transition: border-color 0.2s;
    }

    .label-section input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    .label-section input::placeholder {
      color: rgba(160, 160, 192, 0.5);
    }
  </style>
</head>
<body>

<div id="app"></div>

<!-- Fractum Runtime -->
<script src="../runtime/fractum_runtime.js"></script>

<!-- Hand-compiled Counter Application -->
<script src="out.js"></script>
</body>
</html>
