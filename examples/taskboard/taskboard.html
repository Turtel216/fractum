<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fractum Task Board</title>
  <style>
    /*
      Every class name below is produced by View.fr. The stylesheet is plain
      CSS with no build step: the application decides which classes an element
      has, and this file decides what they look like.
    */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0b0b14;
      min-height: 100vh;
      padding: 40px 20px;
      transition: background 0.25s ease;
    }

    /* ---------- themes ---------- */

    .board {
      --surface:      #16162a;
      --surface-soft: rgba(255, 255, 255, 0.04);
      --line:         rgba(255, 255, 255, 0.08);
      --ink:          #e6e6f0;
      --ink-soft:     #9a9ab8;
      --accent:       #7b8cff;
      --accent-2:     #48c6ef;
      --good:         #3ddc97;
      --warn:         #ffb454;
      --bad:          #ff6b6b;
      --page:         #0b0b14;

      max-width: 860px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 32px;
      color: var(--ink);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
    }

    .board.theme-light {
      --surface:      #ffffff;
      --surface-soft: rgba(15, 20, 50, 0.04);
      --line:         rgba(15, 20, 50, 0.1);
      --ink:          #1b1e33;
      --ink-soft:     #6b6f8c;
      --accent:       #4b5bd7;
      --accent-2:     #1f9bd1;
      --good:         #17a673;
      --warn:         #c47a17;
      --bad:          #d64545;
      --page:         #eef0f7;

      box-shadow: 0 20px 40px rgba(20, 25, 60, 0.12);
    }

    /* The page background follows the theme of the mounted application. */
    body:has(.theme-light) { background: #eef0f7; }

    /* ---------- header ---------- */

    .board-header {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-start;
      justify-content: space-between;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    .board-header h1 {
      font-size: 1.5rem;
      font-weight: 650;
      letter-spacing: 0.01em;
    }

    .subtitle { color: var(--ink-soft); font-size: 0.88rem; margin-top: 4px; }

    .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

    .clock {
      font-variant-numeric: tabular-nums;
      font-size: 1.25rem;
      font-weight: 650;
      padding: 4px 10px;
      border-radius: 8px;
      background: var(--surface-soft);
      color: var(--accent-2);
    }

    .viewport {
      width: 100%;
      text-align: right;
      font-size: 0.72rem;
      color: var(--ink-soft);
    }

    /* ---------- buttons ---------- */

    button {
      font: inherit;
      cursor: pointer;
      border-radius: 9px;
      border: 1px solid transparent;
      transition: transform 0.12s ease, background 0.15s ease, opacity 0.15s ease;
    }

    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    .ghost {
      background: var(--surface-soft);
      border-color: var(--line);
      color: var(--ink-soft);
      padding: 7px 12px;
      font-size: 0.85rem;
    }

    .ghost:hover:not(:disabled) { color: var(--ink); border-color: var(--accent); }
    .ghost.small { padding: 4px 9px; font-size: 0.76rem; }
    .ghost.danger:hover:not(:disabled) { color: var(--bad); border-color: var(--bad); }

    .primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #ffffff;
      font-weight: 600;
      padding: 10px 18px;
    }

    /* ---------- composer ---------- */

    .composer { display: flex; gap: 10px; margin: 22px 0 14px; }

    .draft-input, .priority-select {
      background: var(--surface-soft);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 13px;
      font: inherit;
      color: var(--ink);
      outline: none;
    }

    .draft-input { flex: 1; }
    .draft-input:focus { border-color: var(--accent); }
    .draft-input::placeholder { color: var(--ink-soft); }
    .priority-select { cursor: pointer; }

    /* ---------- banners ---------- */

    .banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-radius: 10px;
      padding: 9px 12px;
      margin-bottom: 14px;
      font-size: 0.86rem;
      border: 1px solid var(--line);
    }

    .banner-info { background: rgba(61, 220, 151, 0.12); color: var(--good); }
    .banner-problem { background: rgba(255, 107, 107, 0.12); color: var(--bad); }

    .banner-close {
      background: none;
      border: none;
      color: inherit;
      opacity: 0.7;
      font-size: 0.78rem;
      text-decoration: underline;
    }

    /* ---------- stats ---------- */

    .progress {
      height: 8px;
      border-radius: 999px;
      background: var(--surface-soft);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--good));
      transition: width 0.3s ease;
    }

    .stat-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0 20px;
    }

    .stat {
      flex: 1;
      min-width: 92px;
      background: var(--surface-soft);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 10px;
      text-align: center;
    }

    .stat-value {
      display: block;
      font-size: 1.15rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .stat-name {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--ink-soft);
      margin-top: 2px;
    }

    /* ---------- toolbar ---------- */

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .tabs { display: flex; gap: 6px; }

    .tab {
      background: none;
      border: 1px solid var(--line);
      color: var(--ink-soft);
      padding: 6px 14px;
      font-size: 0.84rem;
    }

    .tab.is-active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }

    .toolbar-actions { display: flex; gap: 6px; }

    /* ---------- spotlight ---------- */

    .spotlight {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px dashed var(--accent);
      border-radius: 11px;
      padding: 10px 13px;
      margin-bottom: 14px;
      background: var(--surface-soft);
    }

    .spotlight-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
    }

    .spotlight-title { flex: 1; font-weight: 600; }

    /* ---------- task rows ---------- */

    .tasks { list-style: none; display: flex; flex-direction: column; gap: 8px; }

    .task-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface-soft);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 13px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .task-row.is-hovered { border-color: var(--accent); }
    .task-row.is-spotlit { box-shadow: inset 3px 0 0 var(--accent); }
    .task-row.is-done .task-title { text-decoration: line-through; color: var(--ink-soft); }

    /* The tick is drawn with borders, so no icon font or image is needed. */
    .check {
      width: 20px;
      height: 20px;
      flex: none;
      border: 2px solid var(--ink-soft);
      border-radius: 6px;
      cursor: pointer;
      position: relative;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .check:hover { border-color: var(--accent); }

    .check.is-checked { background: var(--good); border-color: var(--good); }

    .check.is-checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 1px;
      width: 5px;
      height: 10px;
      border: solid var(--surface);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .task-title { flex: 1; }

    .badge {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid transparent;
    }

    .badge-low { background: rgba(72, 198, 239, 0.15); color: var(--accent-2); }
    .badge-medium { background: rgba(255, 180, 84, 0.15); color: var(--warn); }
    .badge-high { background: rgba(255, 107, 107, 0.15); color: var(--bad); }

    .row-actions { display: flex; gap: 5px; }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 28px;
      text-align: center;
      color: var(--ink-soft);
      font-size: 0.9rem;
    }

    /* ---------- tips ---------- */

    .tips {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 0.85rem;
    }

    .muted { color: var(--ink-soft); }
    .tips-error { color: var(--bad); flex: 1; }

    .tips-body {
      flex-basis: 100%;
      white-space: pre-wrap;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 0.8rem;
      background: var(--surface-soft);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      color: var(--ink-soft);
    }

    /* ---------- footer ---------- */

    .board-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 0.76rem;
      color: var(--ink-soft);
    }

    .hint { display: flex; align-items: center; gap: 6px; }

    .key {
      font-family: 'SFMono-Regular', Consolas, monospace;
      background: var(--surface-soft);
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 1px 6px;
      color: var(--ink);
    }

    @media (max-width: 640px) {
      .composer { flex-wrap: wrap; }
      .draft-input { flex-basis: 100%; }
      .row-actions { flex-wrap: wrap; justify-content: flex-end; }
    }
  </style>
</head>
<body>

<div id="app"></div>

<!-- The virtual DOM engine and Elm architecture bootstrapper. -->
<script src="../../runtime/fractum_runtime.js"></script>

<!--
  The whole application, compiled from the five Fractum modules next to this
  file into a single JavaScript output:

    fractumc examples/taskboard/Main.fr -o examples/taskboard/out.js

  Serve the directory over HTTP (for example: python3 -m http.server) so that
  the Load tips button can fetch tips.txt. Opening this file directly still
  works; the request simply fails, and the failure is rendered as such.
-->
<script src="out.js"></script>
</body>
</html>
